<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Duka Store{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: .75rem; margin-bottom: 1.5rem; }
    a { color: #0b7a3b; text-decoration: none; }
    .btn { background: #0b7a3b; color: #fff; padding: .5rem 1rem; border-radius: 6px; border: 0; cursor: pointer; font: inherit; display: inline-block; }
    .filters a { margin-right: .75rem; }
    .filters a.active { font-weight: 700; text-decoration: underline; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; }
    .price { font-weight: 700; color: #0b7a3b; }
    .muted { color: #666; font-size: .9rem; }
  </style>
</head>
<body>
  <nav>
    <strong><a href="{% url 'product_list' %}">Duka Store</a></strong>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
