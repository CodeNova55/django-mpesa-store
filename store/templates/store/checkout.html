{% extends "base.html" %}
{% block title %}Checkout{% endblock %}
{% block content %}
  <h2>Checkout</h2>
  <p>Order total: <strong>KES {{ cart.total }}</strong></p>
  <form method="post" style="max-width:420px">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Pay with M-Pesa</button>
    <a href="{% url 'cart_detail' %}">Back to cart</a>
  </form>
{% endblock %}
